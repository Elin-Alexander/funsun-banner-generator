<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fun&Sun Banner</title>
  <style>
    /*  ПОДКЛЮЧЕНИЕ ШРИФТОВ */
    @font-face {
      font-family: 'TT Firs Neue';
      font-weight: 700;
      font-style: normal;
      font-display: swap;
      src: url('/src/fonts/TT_Firs_Neue_Bold.woff2') format('woff2');
    }

    @font-face {
      font-family: 'TT Firs Neue';
      font-weight: 500;
      font-style: normal;
      font-display: swap;
      src: url('/src/fonts/TT_Firs_Neue_Medium.woff2') format('woff2');
    }

    @font-face {
      font-family: 'TT Firs Neue';
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      src: url('/src/fonts/TT_Firs_Neue_Regular.woff2') format('woff2');
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'TT Firs Neue', 'Arial', 'Helvetica', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f5f5f5;
    }

    .banner {
      width: 1160px;
      height: 712px;
      display: flex;
      flex-direction: row;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      border-radius: 20px;
    }

    /* Левая часть с текстом */
    .banner-left {
      width: 45%;
      padding: 50px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    /* Правая часть с изображением */
    .banner-right {
      width: 55%;
      padding: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .banner-right img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
    }

    /* Логотип */
    .logo {
      position: absolute;
      top: 40px;
      left: 40px;
      display: none;
    }

    .logo img {
      width: 290px;
      height: auto;
    }

    /* Плашка (badge) */
    .badge {
      position: absolute;
      top: 40px;
      left: 40px;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 500;  /*  Medium */
      text-transform: uppercase;
      letter-spacing: 1px;
      display: none;
      font-family: 'TT Firs Neue', 'Arial', 'Helvetica', sans-serif;
    }

    /* Заголовок */
    .title {
      font-size: 56px;
      font-weight: 700;  /*  Bold */
      line-height: 1.3;
      margin-bottom: 18px;
      color: #FFFFFF;
      font-family: 'TT Firs Neue', 'Arial', 'Helvetica', sans-serif;
    }

    /* Подзаголовок */
    .subtitle {
      font-size: 32px;
      line-height: 1.4;
      opacity: 0.9;
      color: #FFFFFF;
      font-weight: 700;  /*  Bold */
      font-family: 'TT Firs Neue', 'Arial', 'Helvetica', sans-serif;
    }

    /* Цвета фона по умолчанию */
    .banner.orange { background-color: #FF6B00; }
    .banner.blue { background-color: #4A90E2; }
    .banner.red { background-color: #E63946; }
    .banner.turquoise { background-color: #7FD8BE; }
    .banner.green { background-color: #2D6A4F; }
  </style>
</head>
<body>
  <div class="banner" id="banner">
    <div class="banner-left" id="banner-left">
      <!-- Логотип (SVG) -->
      <div class="logo" id="logo">
        <img src="/src/img/logo.svg" alt="Fun&Sun Logo">
      </div>

      <!-- Плашка -->
      <div class="badge" id="badge"></div>

      <!-- Заголовок -->
      <h1 class="title" id="title">Заголовок баннера</h1>

      <!-- Подзаголовок -->
      <p class="subtitle" id="subtitle">Подзаголовок</p>
    </div>

    <div class="banner-right">
      <img id="banner-image" src="" alt="Banner image">
    </div>
  </div>

  <script>
    // Функция для получения параметров из URL
    function getUrlParam(param, defaultValue = null) {
      const params = new URLSearchParams(window.location.search);
      const value = params.get(param);
      return value !== null ? value : defaultValue;
    }

    // Функция для применения параметров
    function applyParams() {
      // Обязательные параметры
      const bgColor = getUrlParam('bg_color', '#FF6B00');
      const title = getUrlParam('title', 'Заголовок баннера');
      const imageUrl = getUrlParam('image_url', '');

      // Цвет текста
      const textColor = getUrlParam('text_color', '#FFFFFF');

      // Опциональные параметры
      const subtitle = getUrlParam('subtitle', '');
      const showLogo = getUrlParam('show_logo', 'false');
      const badgeText = getUrlParam('badge_text', '');
      const badgeColor = getUrlParam('badge_color', '#FFD700');
      const badgeTextColor = getUrlParam('badge_text_color', '#E63946');

      // Применяем цвет фона
      document.getElementById('banner').style.backgroundColor = bgColor;
      document.getElementById('banner-left').style.backgroundColor = bgColor;

      // Применяем цвет текста к заголовку и подзаголовку
      document.getElementById('title').style.color = textColor;
      document.getElementById('subtitle').style.color = textColor;

      // Применяем заголовок
      document.getElementById('title').textContent = title;

      // Применяем подзаголовок
      const subtitleEl = document.getElementById('subtitle');
      if (subtitle) {
        subtitleEl.textContent = subtitle;
        subtitleEl.style.display = 'block';
      } else {
        subtitleEl.style.display = 'none';
      }

      // Применяем изображение
      const imageEl = document.getElementById('banner-image');
      if (imageUrl) {
        imageEl.src = imageUrl;
        imageEl.style.display = 'block';
      } else {
        imageEl.style.display = 'none';
      }

      // Логика: логотип ИЛИ плашка (взаимоисключающие)
      const logoEl = document.getElementById('logo');
      const badgeEl = document.getElementById('badge');

      if (showLogo === 'true' && !badgeText) {
        // Показываем логотип
        logoEl.style.display = 'block';
        badgeEl.style.display = 'none';
      } else if (badgeText && showLogo !== 'true') {
        // Показываем плашку
        logoEl.style.display = 'none';
        badgeEl.style.display = 'block';
        badgeEl.textContent = badgeText;
        badgeEl.style.backgroundColor = badgeColor;
        badgeEl.style.color = badgeTextColor;
      } else {
        // Ничего не показываем
        logoEl.style.display = 'none';
        badgeEl.style.display = 'none';
      }
    }

    // Применяем параметры при загрузке
    document.addEventListener('DOMContentLoaded', applyParams);
  </script>
</body>
</html>
