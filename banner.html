<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fun&Sun Banner</title>
  <style>
    /* 📍 ПОДКЛЮЧЕНИЕ ШРИФТОВ */
    @font-face {
      font-family: 'TT Firs Neue';
      font-weight: 700;
      font-style: normal;
      font-display: swap;
      src: url('/src/fonts/TT_Firs_Neue_Bold.woff2') format('woff2');
    }

    @font-face {
      font-family: 'TT Firs Neue';
      font-weight: 500;
      font-style: normal;
      font-display: swap;
      src: url('/src/fonts/TT_Firs_Neue_Medium.woff2') format('woff2');
    }

    @font-face {
      font-family: 'TT Firs Neue';
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      src: url('/src/fonts/TT_Firs_Neue_Regular.woff2') format('woff2');
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'TT Firs Neue', 'Arial', 'Helvetica', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f5f5f5;
    }

    /* =============================================
       БАЗОВЫЕ СТИЛИ БАННЕРА
       ============================================= */
    .banner {
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* =============================================
       EMAIL (1160×712px) - ВАША ВЁРСТКА
       ============================================= */
    .banner--email {
      width: 1160px;
      height: 712px;
      border-radius: 32px;
      flex-direction: row;
    }

    .banner--email .banner-left {
      width: 43%;
      padding-left: 28px;
      padding-top: 110px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .banner--email .banner-right {
      width: 63%;
      padding: 28px 0px 28px 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .banner--email .banner-right img {
      width: 634px;
      height: 656px;
      object-fit: cover;
      border-radius: 28px;
    }

    .banner--email .logo {
      position: absolute;
      top: 80px;
      left: 60px;
      display: none;
    }

    .banner--email .logo img {
      width: 290px;
      height: auto;
    }

    .banner--email .badge {
      position: absolute;
      top: 28px;
      left: 28px;
      padding: 8px 34px;
      border-radius: 34px;
      font-size: 24px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: none;
      font-family: 'TT Firs Neue', 'Arial', 'Helvetica', sans-serif;
    }

    .banner--email .title {
      font-size: 60px;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 30px;
      color: #FFFFFF;
      font-family: 'TT Firs Neue', 'Arial', 'Helvetica', sans-serif;
    }

    .banner--email .subtitle {
      font-size: 40px;
      line-height: 1.4;
      color: #FFFFFF;
      font-weight: 500;
      font-family: 'TT Firs Neue', 'Arial', 'Helvetica', sans-serif;
      width: 81%;
    }

    /* =============================================
       WEB PUSH (720×360px) - ИСПРАВЛЕННАЯ ВЁРСТКА
       ============================================= */
    .banner--web {
      width: 720px;
      height: 360px;
      border-radius: 20px;
      flex-direction: row;
    }

    /* Изображение на всю высоту */
    .banner--web .banner-right {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }

    .banner--web .banner-right img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 20px;
    }

    /* Текстовый блок ПОВЕРХ изображения */
    .banner--web .banner-left {
  position: absolute;
  top: 10px;
  left: 10px;
  width: 700px;  /* 720 - 20px (отступы) */
  height: 163px;
  padding: 20px 20px;
  display: flex;
  flex-direction: column;
  z-index: 1;
  border-radius: 14px;
  justify-content: flex-end;
}

    /* Плашка (badge) */
    .banner--web .badge {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 4px 17px;
      border-radius: 18.6px;
      font-size: 14px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0;
      display: none;
      /*height: 25px;*/
      line-height: 1.4;
      font-family: 'TT Firs Neue', 'Arial', 'Helvetica', sans-serif;
      z-index: 2;
    }

    /* Логотип справа сверху */
    .banner--web .logo {
      position: absolute;
      top: 14px;
      right: 14px;
      display: none;
      z-index: 2;
    }

    .banner--web .logo img {
      width: 100px;
      height: auto;
    }

    /* Заголовок */
    .banner--web .title {
      font-size: 30px;
      font-weight: 700;
      line-height: 1.3;
      margin-top: 30px;
      margin-bottom: 6px;
      color: #FFFFFF;
      font-family: 'TT Firs Neue', 'Arial', 'Helvetica', sans-serif;
    }

    /* Подзаголовок */
    .banner--web .subtitle {
      font-size: 20px;
      line-height: 1.4;
      color: #FFFFFF;
      font-weight: 400;
      font-family: 'TT Firs Neue', 'Arial', 'Helvetica', sans-serif;
    }

    /* =============================================
       MOBILE PUSH (720×360px) - СТИЛИ ИЗ ФИГМЫ
       ============================================= */
    .banner--mobile {
      width: 720px;
      height: 360px;
      border-radius: 20px;
      flex-direction: row;
      position: relative;
    }

    .banner--mobile .banner-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .banner--mobile .banner-background img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      border-radius: 14px;
    }

    .banner--mobile .banner-left {
      position: relative;
      z-index: 2;
      width: 250px;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 13px;
      position: absolute;
      left: 14px;
      top: 14px;
    }

    .banner--mobile .banner-right {
      position: absolute;
      width: 427px;
      height: 332px;
      left: 279px;
      top: 14px;
      z-index: 1;
    }

    .banner--mobile .banner-right img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 14px;
    }

    .banner--mobile .badge {
      /*position: absolute;*/
      left: 14px;
      top: 14px;
      padding: 4px 17px;
      border-radius: 18.6px;
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0;
      display: none;
      /*width: 134px;*/
      /*height: 25px;*/
      line-height: 1.4;
      font-family: 'TT Firs Neue', 'Arial', 'Helvetica', sans-serif;
      z-index: 3;
    }

    .banner--mobile .title {
      width: 250px;
      height: auto;
      font-size: 30px;
      font-weight: 700;
      line-height: 39px;
      text-transform: uppercase;
      color: #FFFFFF;
      font-family: 'TT Firs Neue', 'Arial', 'Helvetica', sans-serif;
      flex: none;
      order: 0;
    }

    .banner--mobile .subtitle {
      width: 250px;
      height: auto;
      font-size: 20px;
      font-weight: 500;
      line-height: 26px;
      color: #FFFFFF;
      font-family: 'TT Firs Neue', 'Arial', 'Helvetica', sans-serif;
      flex: none;
      order: 1;
      display: flex;
      align-items: flex-end;
    }

    /* =============================================
       ОБЩИЕ СТИЛИ
       ============================================= */
    .logo img {
      width: 290px;
      height: auto;
    }
  </style>
</head>
<body>
  <!-- Фоновое изображение для Mobile -->
  <div class="banner-background" id="banner-background">
    <img id="banner-background-image" src="" alt="Background">
  </div>

  <div class="banner" id="banner">
    <div class="banner-left" id="banner-left">
      <!-- Логотип -->
      <div class="logo" id="logo">
        <img src="/src/img/logo.svg" alt="Fun&Sun Logo">
      </div>

      <!-- Плашка -->
      <div class="badge" id="badge"></div>

      <!-- Заголовок -->
      <h1 class="title" id="title">Заголовок баннера</h1>

      <!-- Подзаголовок -->
      <p class="subtitle" id="subtitle">Подзаголовок</p>
    </div>

    <div class="banner-right" id="banner-right">
      <img id="banner-image" src="" alt="Banner image">
    </div>
  </div>

  <script>
    function getUrlParam(param, defaultValue = null) {
      const params = new URLSearchParams(window.location.search);
      const value = params.get(param);
      return value !== null ? value : defaultValue;
    }

    function applyParams() {
      const bannerType = getUrlParam('banner_type', 'email');
      const bgColor = getUrlParam('bg_color', '#FF6B00');
      const title = getUrlParam('title', 'Заголовок баннера');
      const imageUrl = getUrlParam('image_url', '');
      const textColor = getUrlParam('text_color', '#FFFFFF');
      const subtitle = getUrlParam('subtitle', '');
      const showLogo = getUrlParam('show_logo', 'false');
      const badgeText = getUrlParam('badge_text', '');
      const badgeColor = getUrlParam('badge_color', '#FFEA2E');
      const badgeTextColor = getUrlParam('badge_text_color', '#FE4D00');

      const bannerEl = document.getElementById('banner');
      bannerEl.className = 'banner';
      bannerEl.classList.add(`banner--${bannerType}`);

      // Применяем цвет фона
if (bannerType === 'mobile') {
  // Для mobile цвет фона применяется ко всему баннеру + текстовому блоку
  bannerEl.style.backgroundColor = bgColor;
  document.getElementById('banner-left').style.backgroundColor = bgColor;
  document.getElementById('badge').style.backgroundColor = badgeColor;
} else if (bannerType === 'web') {
  // Для web цвет фона применяется к текстовому блоку
  document.getElementById('banner-left').style.backgroundColor = bgColor;
  document.getElementById('badge').style.backgroundColor = badgeColor;
} else {
  // Для email цвет фона применяется ко всему баннеру
  bannerEl.style.backgroundColor = bgColor;
  document.getElementById('banner-left').style.backgroundColor = bgColor;
  document.getElementById('badge').style.backgroundColor = badgeColor;
}

      document.getElementById('title').style.color = textColor;
      document.getElementById('subtitle').style.color = textColor;
      document.getElementById('badge').style.color = badgeTextColor;

      document.getElementById('title').textContent = title;

      const subtitleEl = document.getElementById('subtitle');
      if (subtitle) {
        subtitleEl.textContent = subtitle;
        subtitleEl.style.display = bannerType === 'mobile' ? 'flex' : 'block';
      } else {
        subtitleEl.style.display = 'none';
      }

      // Применяем изображение
      const imageEl = document.getElementById('banner-image');
      const bannerBgEl = document.getElementById('banner-background');
      
      if (imageUrl) {
        imageEl.src = imageUrl;
        imageEl.style.display = 'block';
        document.getElementById('banner-right').style.display = 'block';
        bannerBgEl.style.display = 'none';
      } else {
        imageEl.style.display = 'none';
        document.getElementById('banner-right').style.display = 'none';
        bannerBgEl.style.display = 'none';
      }

      // Применяем плашку
      const badgeEl = document.getElementById('badge');
      if (badgeText) {
        badgeEl.textContent = badgeText;
        badgeEl.style.display = 'block';
      } else {
        badgeEl.style.display = 'none';
      }

      // Применяем логотип (для web)
      const logoEl = document.getElementById('logo');
      if (bannerType === 'web' && showLogo === 'true') {
        logoEl.style.display = 'block';
      } else {
        logoEl.style.display = 'none';
      }
    }

    document.addEventListener('DOMContentLoaded', applyParams);
  </script>
</body>
</html>
