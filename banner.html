<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fun&Sun Banner</title>
  <style>
    /* 📍 ПОДКЛЮЧЕНИЕ ШРИФТОВ */
    @font-face {
      font-family: 'TT Firs Neue';
      font-weight: 700;
      font-style: normal;
      font-display: swap;
      src: url('/src/fonts/TT_Firs_Neue_Bold.woff2') format('woff2');
    }

    @font-face {
      font-family: 'TT Firs Neue';
      font-weight: 500;
      font-style: normal;
      font-display: swap;
      src: url('/src/fonts/TT_Firs_Neue_Medium.woff2') format('woff2');
    }

    @font-face {
      font-family: 'TT Firs Neue';
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      src: url('/src/fonts/TT_Firs_Neue_Regular.woff2') format('woff2');
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'TT Firs Neue', 'Arial', 'Helvetica', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f5f5f5;
    }

    /* =============================================
       БАЗОВЫЕ СТИЛИ БАННЕРА
       ============================================= */
    .banner {
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* =============================================
       EMAIL (580×356px) - ВАША ВЁРСТКА
       ============================================= */
    .banner--email {
      width: 580px;
      height: 356px;
      border-radius: 16px;
      flex-direction: row;
    }

    .banner--email .banner-left {
      width: 43%;
      padding-left: 14px;
      padding-top: 55px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .banner--email .banner-right {
      width: 63%;
      padding: 14px 0px 14px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .banner--email .banner-right img {
      width: 317px;
      height: 328px;
      object-fit: cover;
      border-radius: 14px;
    }

    .banner--email .logo {
      position: absolute;
      top: 40px;
      left: 30px;
      display: none;
    }

    .banner--email .logo img {
      width: 145px;
      height: auto;
    }

    .banner--email .badge {
      position: absolute;
      top: 14px;
      left: 14px;
      padding: 4px 17px;
      border-radius: 17px;
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: none;
      font-family: 'TT Firs Neue', 'Arial', 'Helvetica', sans-serif;
    }

    .banner--email .title {
      font-size: 30px;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 15px;
      color: #FFFFFF;
      font-family: 'TT Firs Neue', 'Arial', 'Helvetica', sans-serif;
	  text-transform: uppercase;
    }

    .banner--email .subtitle {
      font-size: 20px;
      line-height: 1.4;
      color: #FFFFFF;
      font-weight: 500;
      font-family: 'TT Firs Neue', 'Arial', 'Helvetica', sans-serif;
      width: 81%;
    }

    /* =============================================
       WEB PUSH (720×360px) - ИСПРАВЛЕННАЯ ВЁРСТКА --web
       ============================================= */
    .banner--web {
      width: 720px;
      height: 360px;
      border-radius: 20px;
      flex-direction: row;
      position: relative;
    }

    .banner--web .banner-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .banner--web .banner-background img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      border-radius: 14px;
    }

    .banner--web .banner-left {
      position: relative;
      z-index: 2;
      width: 250px;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 13px;
      position: absolute;
      left: 14px;
      top: 14px;
    }

    .banner--web .banner-right {
      position: absolute;
      width: 427px;
      height: 332px;
      left: 279px;
      top: 14px;
      z-index: 1;
    }

    .banner--web .banner-right img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 14px;
    }

    .banner--web .badge {
      /*position: absolute;*/
      left: 14px;
      top: 14px;
      padding: 4px 17px;
      border-radius: 18.6px;
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0;
      display: none;
      /*width: 134px;*/
      /*height: 25px;*/
      line-height: 1.4;
      font-family: 'TT Firs Neue', 'Arial', 'Helvetica', sans-serif;
      z-index: 3;
    }

    .banner--web .title {
      width: 250px;
      height: auto;
      font-size: 30px;
      font-weight: 700;
      line-height: 39px;
      text-transform: uppercase;
      color: #FFFFFF;
      font-family: 'TT Firs Neue', 'Arial', 'Helvetica', sans-serif;
      flex: none;
      order: 0;
	  text-transform: uppercase;
    }

    .banner--web .subtitle {
      width: 250px;
      height: auto;
      font-size: 20px;
      font-weight: 500;
      line-height: 26px;
      color: #FFFFFF;
      font-family: 'TT Firs Neue', 'Arial', 'Helvetica', sans-serif;
      flex: none;
      order: 1;
      display: flex;
      align-items: flex-end;
    }

    /* =============================================
   MOBILE PUSH (1000×500px) — ИСПРАВЛЕННЫЙ
   ============================================= */
.banner--mobile {
  width: 1000px; 
  height: 500px;
  border-radius: 20px;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

/* 📍 ТЕКСТОВЫЙ БЛОК СВЕРХУ */
.banner--mobile .banner-left {
  position: absolute; 
  top: 0; 
  left: 0;
  width: 100%; 
  height: 224px; /* 500 - 276 */
  padding: 30px 30px;
  display: flex; 
  flex-direction: column;
  justify-content: center; 
  z-index: 2;
}

/* 📍 ФОТО СНИЗУ */
.banner--mobile .banner-right {
  position: absolute;
  width: 940px; 
  height: 276px;
  left: 50%; 
  transform: translateX(-50%);
  bottom: 30px; /* отступ снизу */
  z-index: 2;
}

.banner--mobile .banner-right img {
  width: 100%; 
  height: 100%;
  object-fit: cover; 
  border-radius: 14px;
}

/* Логотип Fun&Sun (справа сверху) */
.banner--mobile .logo {
  position: absolute; 
  top: 21px; 
  right: 23px;
  display: block; /* всегда показывать для mobile */
  z-index: 3;
}

.banner--mobile .logo img { 
  width: 100%; 
  height: auto; 
}

/* Плашка (слева сверху) */
.banner--mobile .badge {
  position: absolute; 
  top: 30px; 
  left: 30px;
  padding: 4px 17px; 
  border-radius: 18.6px;
  font-size: 12px; 
  font-weight: 500;
  text-transform: uppercase;
  display: block; /* всегда показывать */
  width: auto; /* авто ширина */
  height: 25px;
  line-height: 1.4; 
  font-family: 'TT Firs Neue', sans-serif;
  z-index: 3;
}

/* Шрифты */
.banner--mobile .title {
  font-size: 40px; 
  font-weight: 700;
  line-height: 39px; 
  text-transform: uppercase;
  color: #FFFFFF; 
  font-family: 'TT Firs Neue', sans-serif;
  margin-bottom: 8px;
  text-transform: uppercase;
}

.banner--mobile .subtitle {
  font-size: 26px; 
  font-weight: 500;
  line-height: 26px; 
  color: #FFFFFF;
  font-family: 'TT Firs Neue', sans-serif;
}

    /* =============================================
       ОБЩИЕ СТИЛИ
       ============================================= */
    .logo img {
      width: 290px;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="banner" id="banner">
    <div class="banner-left" id="banner-left">
      <!-- Логотип -->
      <div class="logo" id="logo">
        <img id="logo-image" src="/src/img/candy_logo_red.svg" alt="Fun&Sun Logo">
      </div>
      <!-- Плашка -->
      <div class="badge" id="badge"></div>
      <!-- Заголовок -->
      <h1 class="title" id="title">Заголовок баннера</h1>
      <!-- Подзаголовок -->
      <p class="subtitle" id="subtitle">Подзаголовок</p>
    </div>
    <div class="banner-right" id="banner-right">
      <img id="banner-image" src="" alt="Banner image">
    </div>
  </div>

  <script>
    function getUrlParam(param, defaultValue = null) {
      const params = new URLSearchParams(window.location.search);
      const value = params.get(param);
      return value !== null ? value : defaultValue;
    }

    // 📍 МАППИНГ ЦВЕТОВ К ЛОГОТИПАМ
    const LOGO_MAP = {
      '#FE4D00': 'yellow', '#FF8F09': 'yellow', '#F3202C': 'yellow', '#00BDAA': 'yellow',
      '#FFEA2E': 'red',    '#9BCAFF': 'red',    '#6898F1': 'red',    '#89F4DF': 'red'
    };
    function getLogoVariant(bgColor) {
      const cleanColor = bgColor.replace(/\s/g, '').toUpperCase();
      return LOGO_MAP[cleanColor] || 'red';
    }

    function applyParams() {
      const bannerType = getUrlParam('banner_type', 'email');
      const bgColor = getUrlParam('bg_color', '#FF6B00');
      const title = getUrlParam('title', 'Заголовок баннера');
      const imageUrl = getUrlParam('image_url', '');
      const textColor = getUrlParam('text_color', '#FFFFFF');
      const subtitle = getUrlParam('subtitle', '');
      const badgeText = getUrlParam('badge_text', '');
      const badgeColor = getUrlParam('badge_color', '#FFEA2E');
      const badgeTextColor = getUrlParam('badge_text_color', '#FE4D00');

      const bannerEl = document.getElementById('banner');
      bannerEl.className = 'banner';
      bannerEl.classList.add(`banner--${bannerType}`);

      // Применяем цвет фона
if (bannerType === 'mobile') {
  // Для mobile цвет фона применяется ко всему баннеру + текстовому блоку
  bannerEl.style.backgroundColor = bgColor;
  document.getElementById('banner-left').style.backgroundColor = bgColor;
  document.getElementById('badge').style.backgroundColor = badgeColor;
} else if (bannerType === 'web') {
  // Для web цвет фона применяется к текстовому блоку
  bannerEl.style.backgroundColor = bgColor;
  document.getElementById('banner-left').style.backgroundColor = bgColor;
  document.getElementById('badge').style.backgroundColor = badgeColor;
} else {
  // Для email цвет фона применяется ко всему баннеру
  bannerEl.style.backgroundColor = bgColor;
  document.getElementById('banner-left').style.backgroundColor = bgColor;
  document.getElementById('badge').style.backgroundColor = badgeColor;
}

      // Цвет текста
      document.getElementById('title').style.color = textColor;
      document.getElementById('subtitle').style.color = textColor;
      document.getElementById('badge').style.color = badgeTextColor;

      // Контент
      document.getElementById('title').textContent = title;
      const subtitleEl = document.getElementById('subtitle');
      if (subtitle) {
        subtitleEl.textContent = subtitle;
        subtitleEl.style.display = (bannerType === 'mobile') ? 'flex' : 'block';
      } else {
        subtitleEl.style.display = 'none';
      }

      // Изображение
      const imageEl = document.getElementById('banner-image');
      if (imageUrl) {
        imageEl.src = imageUrl;
        imageEl.style.display = 'block';
        document.getElementById('banner-right').style.display = (bannerType === 'mobile') ? 'block' : 'flex';
      } else {
        document.getElementById('banner-right').style.display = 'none';
      }

      // Плашка
      const badgeEl = document.getElementById('badge');
      if (badgeText) {
        badgeEl.textContent = badgeText;
        badgeEl.style.display = 'block';
      } else {
        badgeEl.style.display = 'none';
      }

      // 📍 Логотип (ТОЛЬКО mobile)
      const logoEl = document.getElementById('logo');
      const logoImg = document.getElementById('logo-image');
      if (bannerType === 'mobile') {
        const variant = getLogoVariant(bgColor);
        logoImg.src = `/src/img/candy_logo_${variant}.svg`;
        logoEl.style.display = 'block';
      } else {
        logoEl.style.display = 'none';
      }
    }

    document.addEventListener('DOMContentLoaded', applyParams);
  </script>
</body>
</html>
