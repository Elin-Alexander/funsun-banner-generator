    /* =============================================

<body>
  <div class="banner" id="banner">
    <div class="banner-left" id="banner-left">
      <!-- Логотип -->
      <div class="logo" id="logo">
        <img id="logo-image" src="/src/img/candy_logo_red.svg" alt="Fun&Sun Logo">
      </div>
      <!-- Плашка -->
      <div class="badge" id="badge"></div>
      <!-- Заголовок -->
      <h1 class="title" id="title">Заголовок баннера</h1>
      <!-- Подзаголовок -->
      <p class="subtitle" id="subtitle">Подзаголовок</p>
    </div>
    <div class="banner-right" id="banner-right">
      <img id="banner-image" class="banner-image-primary" src="" alt="Banner image">
      <img id="banner-image-secondary" class="banner-image-secondary" src="" alt="Banner image secondary">
      <img id="banner-image-tertiary" class="banner-image-tertiary" src="" alt="Banner image tertiary">
    </div>
  </div>

  <script>
    function getUrlParam(param, defaultValue = null) {
      const params = new URLSearchParams(window.location.search);
      const value = params.get(param);
      return value !== null ? value : defaultValue;
    }

    function normalizeLayoutType(layoutType) {
      const normalized = (layoutType || '').trim();
      return /^[a-z0-9_-]+$/i.test(normalized) ? normalized : 'default';
    }

    function fitTextToBox(element, maxFontSize, minFontSize) {
      element.style.fontSize = `${maxFontSize}px`;

      let size = maxFontSize;
      const overflowTolerance = 3;
      while (
        size > minFontSize &&
        (
          element.scrollHeight > element.clientHeight + overflowTolerance ||
          element.scrollWidth > element.clientWidth + overflowTolerance
        )
      ) {
        size -= 1;
        element.style.fontSize = `${size}px`;
      }
    }

    const TWO_IMAGE_LAYOUTS = ['two_images_equal', 'two_images_left_wide', 'two_images_right_wide'];
    const THREE_IMAGE_LAYOUTS = ['three_images_mixed', 'three_images_equal', 'side_text_three_images'];

    // 📍 МАППИНГ ЦВЕТОВ К ЛОГОТИПАМ
    const LOGO_MAP = {
      '#FE4D00': 'yellow', '#FF8F09': 'yellow', '#F3202C': 'yellow', '#00BDAA': 'yellow',
      '#FFEA2E': 'red',    '#9BCAFF': 'red',    '#6898F1': 'red',    '#89F4DF': 'red'
    };
    function getLogoVariant(bgColor) {
      const cleanColor = bgColor.replace(/\s/g, '').toUpperCase();
      return LOGO_MAP[cleanColor] || 'red';
    }

    function showImage(imageElement, src) {
      imageElement.src = src;
      imageElement.style.display = 'block';
    }

    function hideImage(imageElement) {
      imageElement.removeAttribute('src');
      imageElement.style.display = 'none';
    }

    function applyParams() {
      const bannerType = getUrlParam('banner_type', 'email');
      const layoutType = normalizeLayoutType(getUrlParam('layout_type', 'default'));
      const isSplitImageTextLayout = bannerType === 'email' && layoutType === 'split_image_text';
      const isTwoImagesLayout = bannerType === 'email' && TWO_IMAGE_LAYOUTS.includes(layoutType);
      const isThreeImagesLayout = bannerType === 'email' && THREE_IMAGE_LAYOUTS.includes(layoutType);
      const bgColor = getUrlParam('bg_color', '#FF6B00');
      const title = getUrlParam('title', 'Заголовок баннера');
      const imageUrl = getUrlParam('image_url', '');
      const imageUrlSecondary = getUrlParam('image_url_2', imageUrl) || imageUrl;
      const imageUrlTertiary = getUrlParam('image_url_3', imageUrl) || imageUrl;
      const textColor = getUrlParam('text_color', '#FFFFFF');
      const subtitle = getUrlParam('subtitle', '');
      const badgeText = getUrlParam('badge_text', '');
      const badgeColor = getUrlParam('badge_color', '#FFEA2E');
      const badgeTextColor = getUrlParam('badge_text_color', '#FE4D00');

      const bannerEl = document.getElementById('banner');
      const bannerLeftEl = document.getElementById('banner-left');
      const bannerRightEl = document.getElementById('banner-right');
      const badgeEl = document.getElementById('badge');
      const titleEl = document.getElementById('title');
      const subtitleEl = document.getElementById('subtitle');
      const imageEl = document.getElementById('banner-image');
      const imageSecondaryEl = document.getElementById('banner-image-secondary');
      const imageTertiaryEl = document.getElementById('banner-image-tertiary');
      const logoEl = document.getElementById('logo');
      const logoImg = document.getElementById('logo-image');

      bannerEl.className = 'banner';
      bannerEl.classList.add(`banner--${bannerType}`);
      bannerEl.classList.add(`banner--${bannerType}-${layoutType}`);

      // Применяем цвет фона
      if (isSplitImageTextLayout) {
        // Для этого email-layout фон баннера прозрачный, цвет применяется только к нижней плашке
        bannerEl.style.backgroundColor = 'transparent';
      } else {
        bannerEl.style.backgroundColor = bgColor;
      }
      bannerLeftEl.style.backgroundColor = bgColor;
      badgeEl.style.backgroundColor = badgeColor;

      // Цвет текста
      titleEl.style.color = textColor;
      subtitleEl.style.color = textColor;
      badgeEl.style.color = badgeTextColor;

      // Контент
      titleEl.textContent = title;
      if (subtitle && !isSplitImageTextLayout) {
        subtitleEl.textContent = subtitle;
        subtitleEl.style.display = (bannerType === 'mobile') ? 'flex' : 'block';
      } else {
        subtitleEl.style.display = 'none';
      }

      // Изображение
      if (imageUrl) {
        showImage(imageEl, imageUrl);
        if (isTwoImagesLayout || isThreeImagesLayout) {
          showImage(imageSecondaryEl, imageUrlSecondary);
        } else {
          hideImage(imageSecondaryEl);
        }
        if (isThreeImagesLayout) {
          showImage(imageTertiaryEl, imageUrlTertiary);
        } else {
          hideImage(imageTertiaryEl);
        }
        bannerRightEl.style.display = (bannerType === 'mobile' || isSplitImageTextLayout) ? 'block' : 'flex';
      } else {
        hideImage(imageEl);
        hideImage(imageSecondaryEl);
        hideImage(imageTertiaryEl);
        bannerRightEl.style.display = 'none';
      }

      // Плашка
      if (badgeText && !isSplitImageTextLayout) {
        badgeEl.textContent = badgeText;
        badgeEl.style.display = 'block';
      } else {
        badgeEl.style.display = 'none';
      }

      // 📍 Логотип (ТОЛЬКО mobile)
      if (bannerType === 'mobile') {
        const variant = getLogoVariant(bgColor);
        logoImg.src = `/src/img/candy_logo_${variant}.svg`;
        logoEl.style.display = 'block';
      } else {
        logoEl.style.display = 'none';
      }

      if (bannerType === 'email' && layoutType === 'default') {
        fitTextToBox(titleEl, 30, 20);
      }

      if (isThreeImagesLayout) {
        fitTextToBox(titleEl, 30, 20);
        if (subtitleEl.style.display !== 'none') {
          fitTextToBox(subtitleEl, 20, 14);
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      applyParams();
      if (document.fonts) {
        document.fonts.ready.then(applyParams);
      }
    });
  </script>
</body>
</html>
